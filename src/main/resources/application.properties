spring.application.name=WeatherForecastApp
server.port=8080

# Return validation/constraint errors as structured problem details
server.error.include-message=always

# MET Norway Locationforecast API
met.base-url=https://api.met.no/weatherapi/locationforecast/2.0
# NOTE: MET API requires identity, but this wouldn't be a personal email in a final solution
met.user-agent=WeatherForecastApp/1.0 ole_magnus_morken@outlook.com

# Forecast cache implementation: in-memory (default). Add "redis" once a
# distributed ForecastCache bean is available.
forecast.cache.type=in-memory

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
